[project]
name = "seo-cli"
version = "0.1.0"
description = "SEO research CLI: Google Analytics (GA4) and Google Search Console API wrapper."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Yotsuyanagi", email = "t@ytyng.com" },
]
dependencies = [
    "click>=8.1",
    "google-analytics-admin>=0.22",
    "google-analytics-data>=0.18",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
]

[project.scripts]
seo-cli = "seo_cli.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_cli"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
